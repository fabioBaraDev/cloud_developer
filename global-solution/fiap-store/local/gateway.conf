# Papel que, no Kubernetes, e do Ingress:
#   /api/... -> store-api
#   /        -> store-front
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://front:8080;
        proxy_set_header Host $host;
    }
}
