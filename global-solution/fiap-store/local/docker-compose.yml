# Execucao LOCAL da FIAP Store, para conhecer a aplicacao antes de ir para o Kubernetes.
#   cd local && docker compose up --build
#   abra http://localhost:8080
# Para gerar um relatorio (no cluster quem faz isso e o CronJob):
#   docker compose --profile manual run --rm relatorio
name: fiap-store

x-banco: &banco
  DB_HOST: db
  DB_NAME: fiapstore
  DB_USER: fiapstore
  DB_PASSWORD: senha-local        # no Kubernetes isto vem de um Secret
  REDIS_HOST: redis

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiapstore
      POSTGRES_USER: fiapstore
      POSTGRES_PASSWORD: senha-local
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapstore -d fiapstore"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine

  migrate:                          # no Kubernetes: Job db-migrate
    build: ../store-api
    command: ["python", "-m", "app.migrate"]
    environment: *banco
    depends_on:
      db: { condition: service_healthy }

  api:
    build:
      context: ../store-api
      args: { APP_VERSION: "1.0" }
    environment:
      <<: *banco
      APP_ENV: local
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  worker:                           # no Kubernetes: Deployment escalado pelo KEDA
    build: ../store-worker
    environment: *banco
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  relatorio:                        # no Kubernetes: CronJob store-report
    build: ../store-worker
    command: ["python", "-m", "worker.relatorio"]
    environment: *banco
    profiles: ["manual"]

  front:
    build: ../store-front

  gateway:                          # no Kubernetes: Ingress
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, front]

volumes:
  dbdata:
